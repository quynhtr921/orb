<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Cào Thẻ Nhận Quà · BlingAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a10;
    --bg-soft:#111118;
    --panel:#15151f;
    --line:rgba(245,245,247,0.08);
    --violet:#8b5cf6;
    --lime:#d4ff3d;
    --pink:#ff3d9a;
    --ink:#f5f5f7;
    --sub:#8a8a9a;
    --mono:'JetBrains Mono', monospace;
    --disp:'Space Grotesk', sans-serif;
    --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 700px 500px at 15% -10%, #201a3a 0%, transparent 60%),
      radial-gradient(ellipse 600px 500px at 100% 10%, #3a1230 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:var(--body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .stage{ width:100%; max-width:400px; }

  /* ---------- Login gate ---------- */
  .gate{
    background:linear-gradient(180deg, var(--panel) 0%, #101018 100%);
    border:1px solid var(--line);
    border-radius:24px;
    padding:30px 24px 26px;
    position:relative;
    overflow:hidden;
  }
  .gate::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  }
  .gate-mark{
    width:44px; height:44px;
    border-radius:13px;
    background:linear-gradient(135deg, var(--violet), var(--pink));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--disp); font-weight:700; font-size:18px;
    color:#fff;
    margin-bottom:18px;
  }
  .gate h1{
    font-family:var(--disp);
    font-size:22px;
    font-weight:700;
    margin:0 0 6px;
    line-height:1.2;
  }
  .gate p{
    font-size:13px;
    color:var(--sub);
    margin:0 0 22px;
    line-height:1.6;
  }
  .field-label{
    display:block;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--violet);
    margin-bottom:8px;
  }
  .field{
    width:100%;
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 14px;
    color:var(--ink);
    font-family:var(--mono);
    font-size:14px;
    letter-spacing:0.03em;
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .field::placeholder{ color:#4a4a58; }
  .field:focus{
    border-color:var(--violet);
    box-shadow:0 0 0 3px rgba(139,92,246,0.15);
  }
  .field.error{ border-color:var(--pink); }
  .gate-error{
    font-size:12px;
    color:var(--pink);
    margin-top:8px;
    min-height:16px;
    display:block;
  }
  .btn-primary{
    width:100%;
    margin-top:12px;
    padding:14px;
    border-radius:12px;
    border:none;
    background:linear-gradient(90deg, var(--violet), var(--pink));
    color:#fff;
    font-family:var(--disp);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:filter .2s ease, transform .2s ease;
  }
  .btn-primary:hover{ filter:brightness(1.08); transform:translateY(-1px); }

  .hidden{ display:none !important; }

  /* ---------- Profile ---------- */
  .profile{
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 4px 20px;
  }
  .avatar-wrap{ position:relative; width:56px; height:56px; flex:0 0 auto; }
  .avatar-ring{
    position:absolute; inset:-3px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--violet), var(--pink), var(--lime), var(--violet));
    animation:spin 6s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .avatar{
    position:relative;
    width:56px; height:56px;
    border-radius:50%;
    background:#000;
    padding:3px;
    display:block;
  }
  .avatar img{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background:#000;
  }
  .profile-info{ flex:1; min-width:0; }
  .profile-name{
    font-family:var(--disp);
    font-size:17px;
    font-weight:700;
    line-height:1.2;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .verified{ width:14px; height:14px; flex:0 0 auto; color:var(--violet); }
  .profile-id{
    font-family:var(--mono);
    font-size:12px;
    color:var(--sub);
    letter-spacing:0.02em;
    margin-top:2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .profile-balance{ text-align:right; flex:0 0 auto; }
  .balance-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--sub);
  }
  .balance-value{
    font-family:var(--mono);
    font-weight:700;
    font-size:15px;
    color:var(--lime);
    margin-top:2px;
  }

  /* ---------- Card ---------- */
  .card{
    position:relative;
    border-radius:24px;
    background:linear-gradient(180deg, var(--panel) 0%, #101018 100%);
    border:1px solid var(--line);
    padding:22px 20px 24px;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  }
  .card-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
    gap:10px;
  }
  .card-title{ font-family:var(--disp); font-size:15px; font-weight:700; }
  .card-eyebrow{
    font-family:var(--mono);
    font-size:10px;
    color:var(--violet);
    text-transform:uppercase;
    letter-spacing:0.12em;
    display:block;
    margin-bottom:4px;
  }
  .ticket-no{ font-family:var(--mono); font-size:11px; color:var(--sub); flex:0 0 auto; }

  .scratch-frame{
    position:relative;
    border-radius:16px;
    overflow:hidden;
    aspect-ratio:16/10;
    background:#000;
    border:1px solid rgba(255,255,255,0.06);
  }
  .prize-layer{
    position:absolute; inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:16px;
    background:
      radial-gradient(circle at 30% 20%, #241a44 0%, transparent 55%),
      radial-gradient(circle at 80% 80%, #3a1030 0%, transparent 55%),
      #16101f;
  }
  .prize-kicker{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--sub);
    margin-bottom:8px;
    opacity:0; transform:translateY(6px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .prize-name{
    font-family:var(--disp);
    font-weight:700;
    font-size:26px;
    line-height:1.15;
    background:linear-gradient(90deg, var(--lime), #b6ff8f);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    opacity:0; transform:translateY(6px) scale(0.96);
    transition:opacity .45s ease .05s, transform .45s ease .05s;
  }
  .prize-desc{
    font-size:12px; color:var(--sub); margin-top:6px; max-width:230px;
    opacity:0; transform:translateY(6px);
    transition:opacity .45s ease .1s, transform .45s ease .1s;
  }
  .prize-layer.revealed .prize-kicker,
  .prize-layer.revealed .prize-name,
  .prize-layer.revealed .prize-desc{ opacity:1; transform:translateY(0) scale(1); }

  canvas.scratch-canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    touch-action:none;
    cursor:grab;
    opacity:1;
  }
  canvas.scratch-canvas:active{ cursor:grabbing; }
  canvas.scratch-canvas.done{ pointer-events:none; }

  .hint{
    position:absolute; left:50%; bottom:14px;
    transform:translateX(-50%);
    font-family:var(--mono);
    font-size:11px;
    color:rgba(245,245,247,0.55);
    display:flex; align-items:center; gap:6px;
    pointer-events:none;
    animation:pulse 1.8s ease-in-out infinite;
    z-index:2;
    transition:opacity .3s ease;
  }
  @keyframes pulse{ 0%,100%{opacity:.5;} 50%{opacity:1;} }
  .hint svg{ width:13px; height:13px; }

  .progress-row{ display:flex; align-items:center; gap:10px; margin-top:14px; }
  .progress-track{ flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,0.08); overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--violet), var(--pink)); transition:width .12s linear; }
  .progress-pct{ font-family:var(--mono); font-size:11px; color:var(--sub); width:34px; text-align:right; }

  .claim-btn{
    width:100%;
    margin-top:16px;
    padding:14px;
    border-radius:12px;
    border:none;
    background:var(--sub);
    color:#111;
    font-family:var(--disp);
    font-weight:700;
    font-size:14px;
    cursor:not-allowed;
    opacity:0.4;
    transition:all .25s ease;
  }
  .claim-btn.active{
    background:linear-gradient(90deg, var(--lime), #b6ff8f);
    color:#0a1a00;
    opacity:1;
    cursor:pointer;
    box-shadow:0 8px 24px -8px rgba(212,255,61,0.5);
  }
  .claim-btn.active:hover{ filter:brightness(1.05); transform:translateY(-1px); }
  .claim-btn.claimed{
    background:var(--bg-soft);
    color:var(--sub);
    border:1px solid var(--line);
    opacity:1; cursor:default; box-shadow:none;
  }
  .claim-btn.again{
    background:linear-gradient(90deg, var(--violet), var(--pink));
    color:#fff; opacity:1; cursor:pointer; box-shadow:none;
  }

  .code-row{
    display:flex; align-items:center; gap:8px;
    margin-top:10px;
    max-height:0; opacity:0; overflow:hidden;
    transition:max-height .35s ease, opacity .35s ease;
  }
  .code-row.show{ max-height:60px; opacity:1; }
  .code-box{
    flex:1;
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:0.06em;
    background:var(--bg-soft);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:10px 12px;
    color:var(--lime);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .copy-btn{
    flex:0 0 auto;
    background:var(--bg-soft);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:10px 12px;
    font-family:var(--mono);
    font-size:11px;
    cursor:pointer;
    transition:background .2s ease;
  }
  .copy-btn:hover{ background:#1c1c28; }

  .history{
    margin-top:14px;
    border-top:1px solid var(--line);
    padding-top:12px;
    display:none;
  }
  .history.show{ display:block; }
  .history-label{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--sub);
    margin-bottom:8px;
  }
  .history-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:12px;
    padding:5px 0;
    color:var(--ink);
  }
  .history-item span:last-child{ font-family:var(--mono); color:var(--sub); font-size:11px; }

  .footnote{
    text-align:center;
    font-size:11px;
    color:var(--sub);
    margin-top:18px;
    line-height:1.6;
  }
  .footnote b{ color:var(--ink); font-weight:600; }

  .signout{
    display:block;
    margin:10px auto 0;
    background:none;
    border:none;
    color:var(--sub);
    font-family:var(--mono);
    font-size:11px;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .signout:hover{ color:var(--ink); }


  /* ---------- Loading screen ---------- */
  .loader{
    background:linear-gradient(180deg, var(--panel) 0%, #101018 100%);
    border:1px solid var(--line);
    border-radius:24px;
    padding:40px 28px 34px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .loader::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  }
  .loader-ring{
    width:64px; height:64px;
    margin:0 auto 22px;
    border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0deg, var(--violet) 120deg, var(--pink) 240deg, transparent 360deg);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
    animation:spin 1s linear infinite;
  }
  .loader-status{
    font-family:var(--disp);
    font-size:15px;
    font-weight:600;
    min-height:20px;
    transition:opacity .2s ease;
  }
  .loader-sub{
    font-family:var(--mono);
    font-size:11px;
    color:var(--sub);
    margin-top:8px;
    letter-spacing:0.03em;
  }
  .loader-track{
    height:4px;
    border-radius:2px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
    margin-top:22px;
  }
  .loader-bar{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--violet), var(--pink), var(--lime));
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  #confetti{ position:fixed; inset:0; pointer-events:none; z-index:50; }

  @media (prefers-reduced-motion: reduce){
    .avatar-ring{ animation:none; }
    .hint{ animation:none; }
  }
</style>
</head>
<body>

<div class="stage">

  <!-- ============ LOGIN GATE ============ -->
  <div class="gate" id="gate">
    <div class="gate-mark">B</div>
    <h1>Nhập ID tài khoản</h1>
    <p>Sự kiện cào thẻ chỉ dành cho tài khoản đã đăng ký tại Orb.</p>

    <label class="field-label" for="idInput">ID tài khoản</label>
    <input class="field" id="idInput" type="text" autocomplete="off" spellcheck="false" placeholder="Nhập ID tài khoản của bạn">
    <span class="gate-error" id="gateError"></span>
    <button class="btn-primary" id="enterBtn">Vào sự kiện</button>
  </div>


  <!-- ============ LOADING ============ -->
  <div class="loader hidden" id="loader">
    <div class="loader-ring"></div>
    <div class="loader-status" id="loaderStatus">Đang xác thực tài khoản…</div>
    <div class="loader-sub" id="loaderSub">—</div>
    <div class="loader-track"><div class="loader-bar" id="loaderBar"></div></div>
  </div>

  <!-- ============ APP ============ -->
  <div id="app" class="hidden">

    <div class="profile">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar"><img id="avatarImg" src="" alt="Ảnh đại diện"></div>
      </div>
      <div class="profile-info">
        <div class="profile-name">
          <span id="profileName">—</span>
          <svg class="verified" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 2.2 3.2-.6 1 3.1 3.1 1-.6 3.2L23.3 13l-2.2 2.4.6 3.2-3.1 1-1 3.1-3.2-.6L12 24l-2.4-2.2-3.2.6-1-3.1-3.1-1 .6-3.2L.7 13l2.2-2.4-.6-3.2 3.1-1 1-3.1 3.2.6L12 2zm-1.2 13.4l6-6-1.4-1.4-4.6 4.6-2-2-1.4 1.4 3.4 3.4z"/></svg>
        </div>
        <div class="profile-id" id="profileId">—</div>
      </div>
      <div class="profile-balance">
        <div class="balance-label">Thẻ còn lại</div>
        <div class="balance-value" id="ticketsLeft">0</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <span class="card-eyebrow" id="eventName">Sự kiện</span>
          <div class="card-title">Cào thẻ nhận quà</div>
        </div>
        <div class="ticket-no" id="ticketNo">#000000</div>
      </div>

      <div class="scratch-frame" id="scratchFrame">
        <div class="prize-layer" id="prizeLayer">
          <span class="prize-kicker">Bạn nhận được</span>
          <div class="prize-name" id="prizeName">—</div>
          <div class="prize-desc" id="prizeDesc">—</div>
        </div>
        <canvas class="scratch-canvas" id="scratchCanvas"></canvas>
        <div class="hint" id="hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v3M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
          Vuốt để cào lớp phủ
        </div>
      </div>

      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-pct" id="progressPct">0%</div>
      </div>

      <button class="claim-btn" id="claimBtn" disabled>Cào hết lớp phủ để nhận quà</button>

      <div class="code-row" id="codeRow">
        <div class="code-box" id="codeBox">——</div>
        <button class="copy-btn" id="copyBtn">Sao chép</button>
      </div>

      <div class="history" id="history">
        <div class="history-label">Quà đã nhận</div>
        <div id="historyList"></div>
      </div>
    </div>

    <div class="footnote">Mỗi code chỉ có thể sử dụng <b>1 lần</b> · Quà được cộng trực tiếp vào tài khoản <b id="footAccount">—</b></div>
    <button class="signout" id="signoutBtn">Đổi tài khoản</button>

  </div>
</div>

<canvas id="confetti"></canvas>

<script>
(function(){
  "use strict";

  /* =========================================================
     DANH SÁCH TÀI KHOẢN  —  sửa ở đây để thêm/bớt tài khoản
     ========================================================= */
  var ACCOUNTS = {
    "blingai91021": {

  // cho phép đăng nhập bằng tên hiển thị luôn
  var ALIASES = { "jelly":"blingai91021", "vuthithuy81":"vuthuy0834056036" };

  var PRIZES = [
    { name:"10.000đ",         desc:"Cộng thẳng vào số dư tài khoản", weight:30 },

  ];

  var BIG_PRIZES = ["Quạt Cầm Tay Mini", "Ốp Điện Thoại", "Mặt Nạ"];

  /* ---------- helpers ---------- */
  function pickPrize(){
    var total = PRIZES.reduce(function(s,p){ return s+p.weight; },0);
    var r = Math.random()*total;
    for (var i=0;i<PRIZES.length;i++){
      r -= PRIZES[i].weight;
      if (r<=0) return PRIZES[i];
    }
    return PRIZES[0];
  }
  function randCode(){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var out = "BLING-";
    for (var i=0;i<8;i++){
      if (i>0 && i%4===0) out += "-";
      out += chars[Math.floor(Math.random()*chars.length)];
    }
    return out;
  }
  function el(id){ return document.getElementById(id); }

  /* =========================================================
     LOGIN GATE
     ========================================================= */
  var gate = el('gate'), app = el('app');
  var idInput = el('idInput'), gateError = el('gateError');
  var account = null;

  function tryLogin(){
    var raw = idInput.value.trim().toLowerCase();
    if (!raw){
      showGateError("Bạn chưa nhập ID tài khoản.");
      return;
    }
    var key = ACCOUNTS[raw] ? raw : ALIASES[raw];
    if (!key || !ACCOUNTS[key]){
      showGateError("ID không tồn tại hoặc chưa tham gia sự kiện.");
      return;
    }
    account = ACCOUNTS[key];
    gateError.textContent = "";
    idInput.classList.remove('error');
    runLoading();
  }

  /* ---------- màn hình load khi đăng nhập ---------- */
  function runLoading(){
    gate.classList.add('hidden');
    var loader = el('loader');
    loader.classList.remove('hidden');

    var bar = el('loaderBar');
    var status = el('loaderStatus');
    var sub = el('loaderSub');

    var steps = [
      { text:"Đang xác thực tài khoản…",  sub:account.id,                       pct:25, wait:700 },
      { text:"Đang kiểm tra danh tính…",   sub:"Orb · " + account.name,          pct:55, wait:650 },
      { text:"Đang tải trang web…",        sub:account.event,                    pct:82, wait:700 },
      { text:"Sẵn sàng!",                 sub:"Còn " + account.tickets + " lượt cào", pct:100, wait:550 }
    ];

    var i = 0;
    function next(){
      if (i >= steps.length){
        loader.classList.add('hidden');
        bar.style.width = "0%";
        startApp();
        return;
      }
      var st = steps[i++];
      status.style.opacity = "0";
      setTimeout(function(){
        status.textContent = st.text;
        sub.textContent = st.sub;
        status.style.opacity = "1";
      }, 150);
      bar.style.width = st.pct + "%";
      setTimeout(next, st.wait);
    }
    next();
  }
  function showGateError(msg){
    gateError.textContent = msg;
    idInput.classList.add('error');
    idInput.focus();
  }
  el('enterBtn').addEventListener('click', tryLogin);
  idInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryLogin(); });
  idInput.addEventListener('input', function(){
    idInput.classList.remove('error');
    gateError.textContent = "";
  });

  el('signoutBtn').addEventListener('click', function(){
    app.classList.add('hidden');
    el('loader').classList.add('hidden');
    gate.classList.remove('hidden');
    idInput.value = "";
    account = null;
    historyItems = [];
    el('historyList').innerHTML = "";
    el('history').classList.remove('show');
    idInput.focus();
  });

  /* =========================================================

     ========================================================= */
  var ticketsLeft = 0;
  var historyItems = [];
  var prize = null;
  var claimCode = "";

  var frame = el('scratchFrame');
  var canvas = el('scratchCanvas');
  var ctx = canvas.getContext('2d');
  var prizeLayer = el('prizeLayer');
  var hint = el('hint');
  var progressFill = el('progressFill');
  var progressPct = el('progressPct');
  var claimBtn = el('claimBtn');
  var codeRow = el('codeRow');

  var THRESHOLD = 0.92; // phải cào gần như toàn bộ lớp phủ
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function startApp(){
    gate.classList.add('hidden');
    app.classList.remove('hidden');

    el('avatarImg').src = account.avatar;
    el('avatarImg').alt = "Ảnh đại diện " + account.name;
    el('profileName').textContent = account.name;
    el('profileId').textContent = account.id;
    el('eventName').textContent = account.event;
    el('footAccount').textContent = account.id;

    ticketsLeft = account.tickets;
    el('ticketsLeft').textContent = ticketsLeft;

    newTicket();
  }

  function newTicket(){
    revealed = false;
    claimed = false;
    prize = pickPrize();
    claimCode = randCode();

    el('ticketNo').textContent = "#" + (Math.floor(Math.random()*900000)+100000);
    el('prizeName').textContent = prize.name;
    el('prizeDesc').textContent = prize.desc;
    prizeLayer.classList.remove('revealed');

    codeRow.classList.remove('show');
    el('codeBox').textContent = "——";

    claimBtn.className = "claim-btn";
    claimBtn.disabled = true;
    claimBtn.textContent = "Cào hết lớp phủ để nhận quà";

    updateProgressUI(0);

    canvas.classList.remove('done');
    canvas.style.transition = "none";
    canvas.style.opacity = "1";
    hint.style.opacity = "";
    sizeCanvas();
  }

  /* ---------- foil painting ---------- */
  function sizeCanvas(){
    var w = frame.clientWidth, h = frame.clientHeight;
    if (!w || !h) return;
    canvas.width = w*dpr; canvas.height = h*dpr;
    canvas.style.width = w+"px"; canvas.style.height = h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalCompositeOperation = 'source-over';
    paintFoil(w,h);
  }

  function paintFoil(w,h){
    var g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,"#7c5cff");
    g.addColorStop(0.5,"#a35cff");
    g.addColorStop(1,"#ff5cc9");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    ctx.save();
    ctx.globalAlpha = 0.14;
    ctx.fillStyle = "#ffffff";
    for (var x=-h; x<w+h; x+=26){
      ctx.beginPath();
      ctx.moveTo(x,0);
      ctx.lineTo(x+h*0.5,h);
      ctx.lineTo(x+h*0.5+8,h);
      ctx.lineTo(x+8,0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = "#0a0a10";
    var cols = Math.ceil(w/54), rows = Math.ceil(h/46);
    for (var r=0;r<=rows;r++){
      for (var c=0;c<=cols;c++){
        var px = c*54 + (r%2?27:0) + 27;
        var py = r*46 + 27;
        drawPaw(px + Math.sin(r*3+c)*4, py + Math.cos(c*2+r)*4, 8, (r*7+c*13)%360);
      }
    }
    ctx.restore();

    ctx.save();
    ctx.fillStyle = "rgba(10,10,16,0.55)";
    ctx.font = "700 13px 'Space Grotesk', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("BLINGAI", w/2, h/2 - 4);
    ctx.font = "500 10px 'JetBrains Mono', monospace";
    ctx.fillStyle = "rgba(10,10,16,0.4)";
    ctx.fillText("CÀO ĐỂ MỞ THƯỞNG", w/2, h/2 + 14);
    ctx.restore();
  }

  function drawPaw(cx,cy,s,rot){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rot*Math.PI/180);
    ctx.beginPath();
    ctx.ellipse(0, s*0.35, s*0.55, s*0.42, 0, 0, Math.PI*2);
    var toe = s*0.28;
    ctx.ellipse(-s*0.55,-s*0.25, toe*0.5, toe*0.65, -0.3, 0, Math.PI*2);
    ctx.ellipse(-s*0.18,-s*0.55, toe*0.5, toe*0.65, -0.1, 0, Math.PI*2);
    ctx.ellipse(s*0.18,-s*0.55, toe*0.5, toe*0.65, 0.1, 0, Math.PI*2);
    ctx.ellipse(s*0.55,-s*0.25, toe*0.5, toe*0.65, 0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  window.addEventListener('resize', function(){
    if (!revealed && account) sizeCanvas();
  });

  /* ---------- scratching ---------- */
  var scratching = false, lastPt = null;

  function getPos(e){
    var rect = canvas.getBoundingClientRect();
    var cx, cy;
    if (e.touches && e.touches.length){ cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    return { x: cx-rect.left, y: cy-rect.top };
  }
  function scratchAt(x,y){
    var r = Math.max(canvas.clientWidth,60)*0.075;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }
  function scratchLine(a,b){
    var d = Math.hypot(b.x-a.x, b.y-a.y);
    var steps = Math.max(1, Math.floor(d/4));
    for (var i=0;i<=steps;i++){
      var t = i/steps;
      scratchAt(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t);
    }
  }
  function computeProgress(){
    var data;
    try{ data = ctx.getImageData(0,0,canvas.width,canvas.height).data; }
    catch(e){ return 0; }
    var total = data.length/4, cleared = 0, step = 4*37;
    for (var i=3;i<data.length;i+=step){ if (data[i] < 40) cleared++; }
    return Math.min(1, cleared / Math.ceil(total/37));
  }
  var rafPending = false;
  function scheduleProgress(){
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function(){
      rafPending = false;
      var p = computeProgress();
      updateProgressUI(p);
      if (p >= THRESHOLD && !revealed) revealPrize();
    });
  }
  function updateProgressUI(p){
    var pct = Math.min(100, Math.round((p/THRESHOLD)*100));
    progressFill.style.width = pct+"%";
    progressPct.textContent = pct+"%";
  }

  function onDown(e){
    if (revealed || !account) return;
    scratching = true;
    hint.style.opacity = "0";
    lastPt = getPos(e);
    scratchAt(lastPt.x, lastPt.y);
    scheduleProgress();
    e.preventDefault();
  }
  function onMove(e){
    if (!scratching || revealed) return;
    var p = getPos(e);
    scratchLine(lastPt, p);
    lastPt = p;
    scheduleProgress();
    e.preventDefault();
  }
  function onUp(){ scratching = false; lastPt = null; }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  canvas.addEventListener('touchend', onUp);

  function revealPrize(){
    revealed = true;
    canvas.classList.add('done');
    canvas.style.transition = "opacity .5s ease";
    canvas.style.opacity = "0";
    prizeLayer.classList.add('revealed');
    updateProgressUI(1);
    claimBtn.disabled = false;
    claimBtn.classList.add('active');
    claimBtn.textContent = "Nhận quà: " + prize.name;
    fireConfetti(BIG_PRIZES.indexOf(prize.name) !== -1);
  }

  /* ---------- claim ---------- */
  claimBtn.addEventListener('click', function(){
    if (!revealed) return;

    if (claimed){
      // nút đã chuyển thành "Cào thẻ tiếp"
      if (ticketsLeft > 0) newTicket();
      return;
    }

    claimed = true;
    ticketsLeft--;
    el('ticketsLeft').textContent = ticketsLeft;

    el('codeBox').textContent = claimCode;
    codeRow.classList.add('show');

    historyItems.push({ prize: prize.name, code: claimCode });
    renderHistory();

    if (ticketsLeft > 0){
      claimBtn.className = "claim-btn again";
      claimBtn.textContent = "Cào thẻ tiếp (còn " + ticketsLeft + ")";
    } else {
      claimBtn.className = "claim-btn claimed";
      claimBtn.textContent = "Đã dùng hết lượt cào";
    }
  });

  function renderHistory(){
    var list = el('historyList');
    list.innerHTML = "";
    historyItems.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'history-item';
      var a = document.createElement('span'); a.textContent = item.prize;
      var b = document.createElement('span'); b.textContent = item.code;
      row.appendChild(a); row.appendChild(b);
      list.appendChild(row);
    });
    el('history').classList.add('show');
  }

  el('copyBtn').addEventListener('click', function(){
    var btn = this;
    var text = el('codeBox').textContent;
    if (!text || text === "——") return;
    navigator.clipboard.writeText(text).then(function(){
      btn.textContent = "Đã chép!";
      setTimeout(function(){ btn.textContent = "Sao chép"; }, 1400);
    }).catch(function(){});
  });

  /* ---------- confetti ---------- */
  var cc = el('confetti'), cctx = cc.getContext('2d');
  function sizeConfetti(){ cc.width = window.innerWidth; cc.height = window.innerHeight; }
  sizeConfetti();
  window.addEventListener('resize', sizeConfetti);
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fireConfetti(big){
    if (reduceMotion) return;
    var colors = ['#8b5cf6','#ff3d9a','#d4ff3d','#ffffff'];
    var particles = [];
    var originX = window.innerWidth/2;
    var rect = frame.getBoundingClientRect();
    var originY = rect.top + rect.height/2;
    var count = big ? 160 : 90;
    for (var i=0;i<count;i++){
      var angle = Math.random()*Math.PI*2;
      var speed = 3 + Math.random()*(big?9:7);
      particles.push({
        x:originX, y:originY,
        vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-3,
        size:4+Math.random()*4,
        color:colors[Math.floor(Math.random()*colors.length)],
        rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.3,
        life:0, maxLife:70+Math.random()*40
      });
    }
    var f = 0;
    (function step(){
      cctx.clearRect(0,0,cc.width,cc.height);
      var alive = false;
      particles.forEach(function(p){
        if (p.life > p.maxLife) return;
        alive = true;
        p.vy += 0.14; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
        cctx.save();
        cctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
        cctx.translate(p.x,p.y); cctx.rotate(p.rot);
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
        cctx.restore();
      });
      f++;
      if (alive && f < 180) requestAnimationFrame(step);
      else cctx.clearRect(0,0,cc.width,cc.height);
    })();
  }

  idInput.focus();
})();
</script>
</body>
</html>
